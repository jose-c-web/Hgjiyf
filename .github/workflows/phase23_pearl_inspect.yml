name: Phase 23 - Pearl Reference Inspection

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-pearl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Inspect Pearl source
        shell: bash
        run: |
          set -euo pipefail
          git lfs fetch --object-id origin db8c97ff0381cc6a4faf84219d285433f0d0974fd1c82b1b503b704e1cc36438
          git lfs checkout
          ls -lh "PK P3ar1 (PT-BR).zip"
          rm -rf /tmp/pearl /tmp/pearlout
          mkdir -p /tmp/pearl /tmp/pearlout
          unzip -q "PK P3ar1 (PT-BR).zip" -d /tmp/pearl
          echo "ZIP_CONTENTS"
          find /tmp/pearl -maxdepth 3 -type f -printf '%P %s bytes\n' | head -80
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pearl')
          for x in p.rglob('*'):
              if x.is_file():
                  print("FILE",x.relative_to(p),x.stat().st_size)
          PY
